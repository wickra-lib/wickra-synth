# wickra-synth — the reference command-line consumer of wickra-synth-core.
#
# Loads a GenSpec (from a file or the quick-spec flags), generates the batch or
# streamed output, and prints it as text, JSON, or CSV.
[package]
name = "wickra-synth"
description = "Reference CLI for the deterministic synthetic market-microstructure generator: load a spec and print OHLCV, order book, trades and funding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
# docs.rs must build the feature-gated items and mark them, or the published
# reference silently omits whatever sits behind a feature. `--cfg docsrs` is what
# the `doc_cfg` attribute keys on; GitHub CI is stable and never sets it, so this
# is the only place the nightly-only path is exercised.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[bin]]
name = "wickra-synth"
path = "src/main.rs"

[dependencies]
wickra-synth-core.workspace = true
serde_json.workspace = true
clap.workspace = true

[dev-dependencies]
# The CSV output is written in the ecosystem's `timestamp,open,high,low,close,volume`
# form; this dev-dep reads it back with the canonical reader to prove round-trip.
wickra-data.workspace = true
