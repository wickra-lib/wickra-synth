[package]
name = "synth-bench"
description = "Criterion benchmarks for the Wickra Synth core: generation scaling by bar count, book depth and trade rate, plus JSON serialization."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
wickra-synth-core = { workspace = true }

[dev-dependencies]
# Not the plain criterion: this is CodSpeed's drop-in replacement, pulled in
# under the name `criterion` so the bench keeps its `use criterion::{...}` and
# `criterion_main!`. Outside the CodSpeed runner it behaves as criterion does, so
# `cargo bench` locally is unaffected -- and inside it, the benches are actually
# instrumented. Without the alias they run and report nothing, silently.
criterion = { package = "codspeed-criterion-compat", version = "5", features = ["html_reports"] }
serde_json = { workspace = true }

[[bench]]
name = "synth"
harness = false
