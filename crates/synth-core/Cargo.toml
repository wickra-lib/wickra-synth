# synth-core — the deterministic synthetic-microstructure engine.
#
# A serde `GenSpec` plus a portable seeded PRNG (SplitMix64 -> xoshiro256++)
# produce OHLCV candles plus order-book snapshots, trades and funding, exposed
# through a single `command_json` boundary so every language binding draws the
# byte-identical synthetic market for a given seed.
[package]
name = "synth-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Deterministic synthetic market-microstructure engine (OHLCV, order book, trades, funding) driven by a portable seeded PRNG."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
# Optional sanity oracle: run the wickra-core indicators over a generated stream
# to assert it stays finite and in range.
wickra-core = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[features]
# No default features. Generation is sequential by construction -- one PRNG
# stream, one fixed draw order — so there is no parallel engine to switch on,
# and every consumer (native, WASM, fuzz) builds the same code path.
validate = ["dep:wickra-core"]

[package.metadata.docs.rs]
# docs.rs must build the feature-gated items and mark them, or the published
# reference silently omits whatever sits behind a feature. `--cfg docsrs` is what
# the `doc_cfg` attribute keys on; GitHub CI is stable and never sets it, so this
# is the only place the nightly-only path is exercised.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
