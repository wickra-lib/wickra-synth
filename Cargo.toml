# Wickra Synth — workspace.
# A deterministic synthetic-microstructure generator built as one data-driven
# core (`synth-core`): a serde `GenSpec` describes a market regime, a fixed
# portable PRNG (SplitMix64 seeding xoshiro256++) drives it, and the core emits
# OHLCV candles plus order-book snapshots, trades and funding — byte-for-byte
# identical for a given seed on every platform and in every language. The core
# is exposed as a JSON-over-C-ABI data API in ten languages, mirroring the Wickra
# tiering: Rust core -> native Python/Node/WASM + a C ABI hub for C/C++/C#/Go/Java/R.
#
# The `members` list grows as crates are added, phase by phase; the final set is:
#   crates/synth-core, crates/synth-cli, crates/synth-bench,
#   bindings/c, bindings/python, bindings/node, bindings/wasm

[workspace]
resolver = "2"
members = ["crates/synth-core", "crates/synth-cli", "bindings/c"]
# The fuzz crate is its own (detached) workspace — cargo-fuzz builds it on a
# nightly toolchain with sanitizer flags.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["wickra-lib"]
repository = "https://github.com/wickra-lib/wickra-synth"
homepage = "https://wickra.org"
readme = "README.md"
keywords = ["trading", "synthetic", "microstructure", "simulation", "finance"]
categories = ["finance", "simulation", "command-line-utilities"]

[workspace.dependencies]
# Wickra ecosystem. wickra-data supplies the canonical `Candle` output shape;
# wickra-core is optional (the `validate` feature runs the 514 indicators over a
# generated stream as a sanity check). Both ship on crates.io — no git deps.
wickra-data = "0.9"
wickra-core = "0.9"
# Workspace-internal crate, referenced by the CLI, bench and bindings.
# Serial by default (v1 is single-symbol); consumers that want data-parallel
# generation opt in with `features = ["parallel"]`.
synth-core = { version = "0.1.0", path = "crates/synth-core", default-features = false }
# Serialization — the data-driven boundary (spec/command/output as JSON).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Exact decimal arithmetic where price/qty precision matters.
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "2"
# Data-parallel generation across independent seeds/paths.
rayon = "1"
clap = { version = "4", features = ["derive"] }
# C ABI header generation.
cbindgen = "0.27"
# Test/dev.
criterion = "0.8"
proptest = "1"

[workspace.lints.rust]
# The core and all bindings are safe Rust; the C ABI hub re-allows unsafe
# locally (it must call across the FFI boundary).
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints (same precedent as the wickra core).
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"

[profile.release]
# Panics must never unwind across the C ABI boundary: abort instead.
lto = true
codegen-units = 1
panic = "abort"
strip = true
