# Single source of truth for repo-level identity (org slug, maintainer email,
# canonical URLs). Mirrors the convention used in the main `wickra` repository.

[repo]
org          = "wickra-lib"
name         = "wickra-synth"
url          = "https://github.com/wickra-lib/wickra-synth"
homepage     = "https://wickra.org"
issues_url   = "https://github.com/wickra-lib/wickra-synth/issues"
discussions  = "https://github.com/wickra-lib/wickra-synth/discussions"
security_url = "https://github.com/wickra-lib/wickra-synth/security/advisories/new"
# No docs_url: unlike the main repository, this project's deep dives live in
# docs/ beside the code and there is no documentation site. site_git is the
# marketing site's repository, which is not deployed yet -- named here rather
# than linked as a URL, because a domain that does not resolve reads as a
# resource the reader failed to reach.
site_git     = "https://github.com/wickra-lib/wickra-synth-site"

[maintainer]
# `handle` is the natural-person credit shown in package manifests; it does not
# move with a GitHub org transfer. `github` is the org @-mention slug, for prose
# and links only -- deliberately NOT for CODEOWNERS: an org slug there resolves
# to no reviewer, GitHub reports "Unknown owner" and never requests a review.
# CODEOWNERS names the personal handle.
handle = "kingchenc"
email  = "support@wickra.org"
github = "wickra-lib"

[badges]
codecov_repo = "wickra-lib/wickra-synth"
ci_workflow  = "ci.yml"

[audit]
# Forbidden substrings that must not appear in source (the pre-org-migration
# repo path). Kept in lock-step with the main repository's convention.
forbidden = [
    "kingchenc/wickra-synth",
]

# Paths exempt from the forbidden-substring scan: auto-generated / lockfiles and
# the two files that legitimately spell the forbidden value out (this file
# defines it; the audit script matches against it).
allowlist = [
    "target/",
    "node_modules/",
    "fuzz/target/",
    ".venv/",
    "Cargo.lock",
    "package-lock.json",
    "bindings/node/index.js",
    "bindings/node/index.d.ts",
    "repo-metadata.toml",
    ".github/scripts/sync-metadata.py",
]
