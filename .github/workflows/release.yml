name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least-privilege default for the auto-injected GITHUB_TOKEN. The publish jobs
# push to external registries via their own secrets, not the GITHUB_TOKEN, so
# they need no repo write. The jobs that genuinely write through the
# GITHUB_TOKEN (github-release, node-/wasm-publish provenance, attestations)
# declare those rights in their own job-level permissions blocks.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Network-flake resilience: retry transient registry/DNS failures at the tool
  # level so a blip fetching crates.io / npm inside any build or publish step
  # retries automatically instead of failing the job.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "120000"
  PIP_RETRIES: "5"
  PIP_DEFAULT_TIMEOUT: "120"

jobs:
  # --------------------------------------------------------------------------
  # The gate. Everything that builds or publishes hangs off this job, so there
  # is one place that decides whether a run may publish at all, and one place to
  # read when asking why a run did not.
  #
  # Two things it refuses. A run that is not a tag push: workflow_dispatch stays
  # for re-running a release whose publish half failed, and without this check a
  # dispatch from any branch would publish that branch to six registries under
  # whatever version string its manifests carried. And a tag whose name
  # disagrees with the workspace version: v0.1.1 on a tree that says 0.1.0
  # publishes 0.1.0 everywhere and labels it something else, which no later
  # release can take back.
  # --------------------------------------------------------------------------
  gate:
    name: Nothing publishes before this
    # Every build job, so that "something does not build" happens in front of the
    # first irreversible step rather than beside it. Six registries cannot be
    # made atomic; that failure can still be moved.
    needs: [python-wheels, python-sdist, node-build, wasm-build, c-abi-build, cli-binaries]
    # Generous because this job waits for ci.yml to settle on the tagged commit;
    # the wait itself is bounded to 45 minutes inside the step.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read the workflow runs on the tagged commit
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse anything but a tag that matches the tree
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME:$REF" in
            push:refs/tags/v*) ;;
            *)
              echo "::error::release.yml publishes only from a v* tag push (this run: $EVENT_NAME on $REF)"
              exit 1
              ;;
          esac
          tag_version="${REF_NAME#v}"
          tree_version=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$tree_version" ]; then
            echo "::error::could not read the workspace version from Cargo.toml"
            exit 1
          fi
          if [ "$tag_version" != "$tree_version" ]; then
            echo "::error::tag v$tag_version does not match the workspace version $tree_version"
            exit 1
          fi
          echo "version=$tree_version" >> "$GITHUB_OUTPUT"
          echo "publishing $tree_version from $REF_NAME"

      # The same declarations ci.yml checks on every pull request, but against
      # the tag being released rather than against main. A version that drifted
      # after the last merge is caught here, before the first push to a registry
      # rather than between two of them.
      - name: Every version declaration agrees with the tag
        run: python3 scripts/check_version_sync.py

      # And ci.yml has to have passed on this exact commit. It never runs on a
      # tag, so what is read here is the verdict from the commit's life on main
      # -- which is the point: the tag names a commit, and the question is
      # whether that commit was tested.
      #
      # Asked of the ci.yml *workflow run*, not of the commit's check runs. The
      # check-run list includes this workflow's own jobs, and those are queued
      # behind this gate, so waiting for them to complete waits forever.
      #
      # The distinction that matters is "not decided yet" against "decided
      # against". A tag pushed straight after its merge lands while ci.yml is
      # still queued, and refusing there turns "tagged a minute early" into a
      # failed release. So an undecided run is waited on, bounded at 45 minutes
      # -- twenty was tried and is under the observed runtime of this matrix. A
      # red conclusion still ends it immediately.
      - name: ci.yml is green on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            state=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
                      -q '(.workflow_runs[0] // {}) | "\(.status // "missing") \(.conclusion // "null")"')
            status=${state%% *}
            conclusion=${state##* }
            if [ "$conclusion" = "success" ]; then
              echo "ci.yml on $SHA: success"
              break
            fi
            if [ "$conclusion" != "null" ]; then
              echo "::error::ci.yml on $SHA is $conclusion; refusing to publish"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::ci.yml on $SHA did not finish within 45 minutes ($status); refusing to publish"
              exit 1
            fi
            echo "ci.yml on $SHA: $status -- waiting"
            sleep 30
          done

      # And nothing else that did run may have failed. A roster of required
      # workflow names would go stale -- codspeed.yml is path-filtered and
      # legitimately does not run for a version bump -- so the rule is about
      # outcomes rather than about a list: whatever ran, none of it is red.
      # "Release" is excluded because that is this run, whose own jobs are
      # necessarily still going.
      - name: Nothing else on the tagged commit is red
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bad=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                  -q '[.workflow_runs[]
                       | select(.name != "Release")
                       | select(.conclusion == "failure" or .conclusion == "timed_out"
                                or .conclusion == "cancelled")
                       | .name] | unique | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::the tagged commit has failing runs ($bad); refusing to publish"
            exit 1
          fi
          echo "every workflow that ran on this commit is green"

  # --------------------------------------------------------------------------
  # crates.io: wickra-synth-core then the wickra-synth crate (wickra-synth binary)
  # --------------------------------------------------------------------------
  cargo-publish:
    name: Publish to crates.io
    timeout-minutes: 45
    needs: [gate]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] release-only, maintainer-triggered tag build

      # Idempotent publishing: if the version is already on crates.io we treat
      # that as success so re-runs of the workflow do not fail.
      - name: Publish wickra-synth-core (idempotent)
        run: |
          set -uo pipefail
          if out=$(cargo publish -p wickra-synth-core --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: wickra-synth-core is already published at this version"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index to refresh
        run: sleep 45

      - name: Publish wickra-synth (idempotent)
        run: |
          set -uo pipefail
          if out=$(cargo publish -p wickra-synth --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: wickra-synth is already published at this version"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Produce .crate files for the GitHub Release attachments.
      - name: Build .crate files for release attachment
        run: |
          cargo package -p wickra-synth-core
          cargo package -p wickra-synth

      - name: Upload .crate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-files
          path: target/package/*.crate

      # CycloneDX SBOM per published crate.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOMs
        run: |
          cargo cyclonedx --format json --top-level
          mkdir -p sboms
          cp crates/synth-core/wickra-synth-core.cdx.json sboms/
          cp crates/synth-cli/wickra-synth.cdx.json sboms/
          ls -lh sboms/

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sboms/*.cdx.json

  # --------------------------------------------------------------------------
  # PyPI: cross-platform wheels + sdist
  # --------------------------------------------------------------------------
  python-wheels:
    name: Build wheels (${{ matrix.target }}/${{ matrix.manylinux }} on ${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64, manylinux: auto }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
          - { os: windows-11-arm, target: aarch64, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Sync root README into bindings/python so it ships with the wheel
        shell: bash
        run: cp README.md bindings/python/README.md
      # The Python binding depends only on wickra-synth-core, which is generation and
      # serialization with no native networking, so the manylinux/musllinux
      # containers build the wheel with no extra system dependencies.
      # ci.yml proves that in both containers on every pull request; without
      # that job this would be the first place a container-only failure showed.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --strip --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*

  python-sdist:
    name: Build Python sdist
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync root README into bindings/python so it ships in the sdist
        run: cp README.md bindings/python/README.md
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: bindings/python/dist/*

  python-publish:
    name: Publish to PyPI
    timeout-minutes: 45
    needs: [gate, python-wheels, python-sdist]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Upload to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          args: --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # --------------------------------------------------------------------------
  # npm: per-platform native binaries + main meta-package
  # --------------------------------------------------------------------------
  node-build:
    name: Node build (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning] release-only, maintainer-triggered tag build
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] release-only, maintainer-triggered tag build
      # npm install (not ci): the per-platform optionalDependencies are not yet
      # published, so they are absent from the lock and npm ci would reject it.
      - name: Install Node deps
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Build native module
        working-directory: bindings/node
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/wickra-synth.*.node
          if-no-files-found: error

  node-publish:
    name: Publish to npm
    timeout-minutes: 45
    needs: [gate, node-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore provenance from the GitHub OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning] release-only, maintainer-triggered tag build
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install Node deps
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Download all platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/node/artifacts
          pattern: bindings-*
      # The npm/<platform>/package.json templates are committed (bindings/node/npm/),
      # so `napi artifacts` only drops the freshly built .node binary into the
      # matching directory. napi-rs CLI 3 renamed `--dir` to `--output-dir`.
      #
      # This has to run before the two proofs below: they read npm/<platform>/,
      # which is empty until this step fills it. Standing after them, the binary
      # check could not pass on any tag -- it asked whether the move had happened
      # two steps before the move.
      - name: Move binaries into platform package layout
        working-directory: bindings/node
        run: npx napi artifacts --output-dir artifacts

      # Two proofs before anything irreversible. `napi artifacts` silently
      # leaves a directory empty when its artefact did not arrive, and `files`
      # silently drops a name that is not there -- so a stub that installs
      # cleanly and fails at require(), and a package with no licence text, both
      # publish without a word. Neither is recoverable afterwards.
      - name: Every platform package has its binary
        working-directory: bindings/node
        run: |
          set -euo pipefail
          missing=0
          for dir in npm/*/; do
            pkg=$(basename "$dir")
            if ! ls "$dir"/*.node >/dev/null 2>&1; then
              echo "::error::wickra-synth-$pkg has no .node binary; it would publish as an empty stub"
              missing=1
            else
              echo "wickra-synth-$pkg: $(basename "$dir"/*.node)"
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Stage the licence texts and prove they will be packed
        working-directory: bindings/node
        run: |
          set -euo pipefail
          for dir in . npm/*/; do
            cp ../../LICENSE-MIT ../../LICENSE-APACHE "$dir/"
          done
          for dir in . npm/*/; do
            # The ${...} below are JavaScript template literals inside a
            # single-quoted node script, not shell expansions.
            # shellcheck disable=SC2016
            ( cd "$dir" && npm pack --dry-run --json ) | node -e '
              const chunks = [];
              process.stdin.on("data", c => chunks.push(c));
              process.stdin.on("end", () => {
                const pkg = JSON.parse(chunks.join(""))[0];
                const names = pkg.files.map(f => f.path);
                const missing = ["LICENSE-MIT", "LICENSE-APACHE"].filter(n => !names.includes(n));
                if (missing.length) {
                  console.error(`::error::${pkg.name} would publish without ${missing.join(" and ")}`);
                  process.exit(1);
                }
                console.log(`${pkg.name}: licence texts present`);
              });'
          done

      - name: Publish platform packages (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          fail=0
          publish_dir() {
            local dir=$1
            local pkg
            pkg=$(basename "$dir")
            local pkgname="wickra-synth-$pkg"
            local existing
            existing=$(npm view "$pkgname@$version" version 2>/dev/null)
            if [ "$existing" = "$version" ]; then
              echo "::notice::skip $pkgname@$version (already on npm)"
              return 0
            fi
            echo "::group::publish $pkgname@$version"
            (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
            local rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::first attempt of $pkgname failed (rc=$rc); retrying after 30s"
              sleep 30
              (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
              rc=$?
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::$pkgname could not be published — the release would land with a missing platform binary; failing the job."
              return 1
            fi
            return 0
          }
          for dir in npm/*/; do
            publish_dir "$dir" || fail=1
          done
          exit $fail

      - name: Sync root README into bindings/node so it ships with the npm tarball
        shell: bash
        run: cp ../../README.md README.md
        working-directory: bindings/node

      - name: Publish main package to npm (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          existing=$(npm view "wickra-synth@$version" version 2>/dev/null)
          if [ "$existing" = "$version" ]; then
            echo "::notice::skip wickra-synth@$version (already on npm)"
            exit 0
          fi
          npm publish --access public --ignore-scripts --provenance
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::first attempt failed (rc=$rc); retrying after 30s"
            sleep 30
            npm publish --access public --ignore-scripts --provenance
            rc=$?
          fi
          exit $rc

      - name: Pack node tarballs for release attachment
        working-directory: bindings/node
        run: |
          npm pack --ignore-scripts
          for d in npm/*/; do
            (cd "$d" && npm pack --ignore-scripts)
          done

      - name: Upload Node tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-tarballs
          path: |
            bindings/node/*.tgz
            bindings/node/npm/*/*.tgz

  # --------------------------------------------------------------------------
  # WASM: wasm-pack build + npm publish (as `wickra-synth-wasm`)
  # --------------------------------------------------------------------------
  # Built in front of the gate and published behind it. Written as one job, the
  # wasm build sat behind the gate -- the only build the gate could not see --
  # and a failure there arrives after the other five registries have published.
  wasm-build:
    name: Build wickra-synth-wasm
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning] release-only, maintainer-triggered tag build
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] release-only, maintainer-triggered tag build
      - name: Install wasm-pack (latest, via prebuilt binary)
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: wasm-pack
      - name: Build WASM package (bundler target)
        run: wasm-pack build bindings/wasm --target bundler --release
      - name: Enrich generated package.json with author + repo metadata
        working-directory: bindings/wasm/pkg
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.author = 'kingchenc <support@wickra.org>';
            pkg.repository = { type: 'git', url: 'https://github.com/wickra-lib/wickra-synth' };
            pkg.homepage = 'https://github.com/wickra-lib/wickra-synth';
            pkg.bugs = { url: 'https://github.com/wickra-lib/wickra-synth/issues' };
            pkg.license = 'MIT OR Apache-2.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      # The licence texts are not in the generated pkg/ directory; wasm-pack
      # writes the manifest and the glue and nothing else.
      - name: Stage the licence texts into the generated package
        run: cp LICENSE-MIT LICENSE-APACHE bindings/wasm/pkg/
      - name: Pack wickra-synth-wasm for release attachment
        working-directory: bindings/wasm/pkg
        run: npm pack
      # The whole generated package, not just the tarball: wasm-publish needs a
      # directory to `npm publish` from, and rebuilding it there would put the
      # build back behind the gate.
      - name: Upload the generated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-package
          path: bindings/wasm/pkg/
          if-no-files-found: error
      - name: Upload WASM tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-tarball
          path: bindings/wasm/pkg/wickra-synth-wasm-*.tgz
          if-no-files-found: error

  wasm-publish:
    name: Publish wickra-synth-wasm to npm
    timeout-minutes: 45
    needs: [gate, wasm-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore provenance from the GitHub OIDC token
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning] release-only, maintainer-triggered tag build
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Download the generated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: wasm-pkg
      - name: Publish wickra-synth-wasm to npm (idempotent)
        working-directory: wasm-pkg
        run: |
          set -uo pipefail
          if out=$(npm publish --access public --provenance 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "You cannot publish over"; then
            echo "skip: this version is already on npm"
          else
            echo "$out"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --------------------------------------------------------------------------
  # CLI binaries: build the wickra-synth executable per platform on a native
  # runner and attach it to the GitHub Release (in addition to `cargo install`).
  # --------------------------------------------------------------------------
  cli-binaries:
    name: CLI binary (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] release-only, maintainer-triggered tag build
      - name: Build the CLI binary
        run: cargo build -p wickra-synth --release --target ${{ matrix.target }}
      - name: Package the binary
        shell: bash
        run: |
          set -e
          dir="wickra-synth-${{ matrix.target }}"
          mkdir -p "$dir"
          bin="target/${{ matrix.target }}/release/wickra-synth"
          if [ -f "$bin.exe" ]; then
            cp "$bin.exe" "$dir/"
          else
            cp "$bin" "$dir/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: wickra-synth-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # C ABI native libraries (bindings/c) — built per target, attached to the
  # GitHub Release and consumed by the C#, Java and Go publish jobs.
  # --------------------------------------------------------------------------
  c-abi-build:
    name: C ABI library (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning] release-only, maintainer-triggered tag build
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-synth-c --release --target ${{ matrix.target }}
      - name: Package header + libraries
        shell: bash
        run: |
          set -e
          dir="wickra-synth-c-${{ matrix.target }}"
          mkdir -p "$dir/include" "$dir/lib"
          cp bindings/c/include/wickra_synth.h "$dir/include/"
          for f in libwickra_synth.so libwickra_synth.a libwickra_synth.dylib wickra_synth.dll wickra_synth.dll.lib wickra_synth.lib; do
            src="target/${{ matrix.target }}/release/$f"
            [ -f "$src" ] && cp "$src" "$dir/lib/"
          done
          tar -czf "$dir.tar.gz" "$dir"
          echo "packaged $dir:"; ls -lR "$dir"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c-abi-${{ matrix.target }}
          path: wickra-synth-c-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Pack and publish the .NET binding to NuGet. Authentication uses NuGet Trusted
  # Publishing (OIDC) — no long-lived API key. Configure the trusted-publishing
  # policy on nuget.org (owner KingchenC, repo wickra-lib/wickra-synth,
  # workflow release.yml) for the Wickra.Synth package.
  csharp-publish:
    name: Publish to NuGet
    timeout-minutes: 45
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Stage native libraries into runtimes/<rid>/native
        shell: bash
        run: |
          set -e
          declare -A RID=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/csharp/WickraSynth/runtimes
          for target in "${!RID[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-synth-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${RID[$target]}/native"; mkdir -p "$dest"
            for f in libwickra_synth.so libwickra_synth.dylib wickra_synth.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -n "$src" ] && cp "$src" "$dest/"
            done
            echo "staged ${RID[$target]}:"; ls -l "$dest"
          done
      - name: Pack
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 20
          shell: bash
          command: |
            version="${GITHUB_REF_NAME#v}"
            dotnet pack bindings/csharp/WickraSynth/WickraSynth.csproj -c Release -p:Version="$version" -o nupkg
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget_login
        with:
          user: KingchenC
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Upload the NuGet package as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: nupkg/*.nupkg
          if-no-files-found: error

  # Publish the Java binding to Maven Central. The org.wickra namespace is
  # verified; auth uses the Sonatype Central token (CENTRAL_USERNAME /
  # CENTRAL_PASSWORD) and artifacts are GPG-signed (GPG_PRIVATE_KEY /
  # GPG_PASSPHRASE). The pom version must match the release tag.
  java-publish:
    name: Publish to Maven Central
    timeout-minutes: 45
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Stage native libraries into resources/native/<os>-<arch>
        shell: bash
        run: |
          set -e
          declare -A PLAT=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/java/src/main/resources/native
          for target in "${!PLAT[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-synth-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${PLAT[$target]}"; mkdir -p "$dest"
            for f in libwickra_synth.so libwickra_synth.dylib wickra_synth.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -n "$src" ] && cp "$src" "$dest/"
            done
            echo "staged ${PLAT[$target]}:"; ls -l "$dest"
          done
      - name: Set up JDK 25 + Maven Central credentials + GPG
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -f bindings/java -Prelease deploy -DskipTests

      # The jar, sources and javadoc the deploy just built, kept for the release
      # page and for the provenance attestation. Without this the only place the
      # artefact existed was Maven Central, so the GitHub release listed every
      # other ecosystem's download and none for the JVM.
      - name: Upload the Maven artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-artifacts
          path: bindings/java/target/*.jar
          if-no-files-found: error

  # Mirror the in-repo Go module (bindings/go) to the standalone
  # wickra-synth-go repository so `go get
  # github.com/wickra-lib/wickra-synth-go` builds with no extra steps. The
  # in-repo module keeps the prebuilt libraries git-ignored; the mirror commits
  # them per platform under lib/<goos>_<goarch>/ alongside the vendored header.
  # Independent of the GitHub-release job so a Go hiccup never blocks the C/C++
  # asset release. The push uses a fine-grained PAT (GO_MIRROR_TOKEN,
  # contents:write on wickra-synth-go); the mirror is a derived artifact,
  # so its bot commit is intentionally unsigned.
  go-mirror:
    name: Mirror the Go module to wickra-synth-go
    timeout-minutes: 45 # backstop only: release build/publish jobs compile from source (vendored OpenSSL) and must not be killed mid-build; far above the ~10 min real runtime
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts

      - name: Assemble the wickra-synth-go module tree
        shell: bash
        run: |
          set -e
          out=wickra-synth-go-module
          mkdir -p "$out/include" "$out/lib"
          # Single-package Go source + vendored C ABI header. Tests are left
          # behind on purpose: they read ../../golden, which exists here and
          # nowhere in the module a consumer downloads, so shipping them means
          # `go test ./...` fails against the mirror on a path that was never
          # going to be there.
          for f in bindings/go/*.go; do
            case "$f" in *_test.go) continue ;; esac
            cp "$f" "$out/"
          done
          cp bindings/go/include/wickra_synth.h "$out/include/"
          cp bindings/go/README.md "$out/"
          # Ship the dual license so pkg.go.dev detects a redistributable license.
          cp LICENSE-MIT LICENSE-APACHE "$out/"
          # Standalone module path (the in-repo go.mod points at the subdir).
          printf 'module github.com/wickra-lib/wickra-synth-go\n\ngo 1.23\n' > "$out/go.mod"
          # Point install instructions at the standalone module path.
          sed -i 's#github.com/wickra-lib/wickra-synth/bindings/go#github.com/wickra-lib/wickra-synth-go#g' \
            "$out/README.md" "$out"/*.go
          # Stage each prebuilt library under lib/<goos>_<goarch>/ (committed in
          # the mirror, unlike the in-repo lib/.gitignore). "<dir> <libfile>".
          declare -A GO=(
            [x86_64-unknown-linux-gnu]="linux_amd64 libwickra_synth.so"
            [aarch64-unknown-linux-gnu]="linux_arm64 libwickra_synth.so"
            [x86_64-apple-darwin]="darwin_amd64 libwickra_synth.dylib"
            [aarch64-apple-darwin]="darwin_arm64 libwickra_synth.dylib"
            [x86_64-pc-windows-msvc]="windows_amd64 wickra_synth.dll"
            [aarch64-pc-windows-msvc]="windows_arm64 wickra_synth.dll"
          )
          for target in "${!GO[@]}"; do
            read -r dir libfile <<< "${GO[$target]}"
            archive=$(find c-abi-artifacts -name "wickra-synth-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            src=$(find "$tmp" -name "$libfile" | head -1)
            if [ -z "$src" ]; then
              echo "::error::missing $libfile for $target"; exit 1
            fi
            mkdir -p "$out/lib/$dir"; cp "$src" "$out/lib/$dir/"
          done
          echo "assembled module:"; find "$out" -type f | sort

      # Compile what is about to be pushed. The step above rewrites the module
      # path in every .go file with sed; nothing checked the result, so a bad
      # rewrite would be published and tagged, and found by the first person to
      # `go get` it. cgo links against the Linux library staged above.
      - name: Build the assembled module before pushing it
        shell: bash
        run: |
          set -euo pipefail
          cd wickra-synth-go-module
          export CGO_LDFLAGS="-L$PWD/lib/linux_amd64 -lwickra_synth"
          export LD_LIBRARY_PATH="$PWD/lib/linux_amd64:${LD_LIBRARY_PATH:-}"
          go vet ./...
          go build ./...

      - name: Push to wickra-synth-go and tag the release
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.GO_MIRROR_TOKEN }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/wickra-lib/wickra-synth-go.git"
          git clone -q "$remote" mirror-repo
          cd mirror-repo
          git config user.name "wickra-bot"
          git config user.email "support@wickra.org"
          git symbolic-ref HEAD refs/heads/main
          # Replace all tracked content with the freshly assembled tree.
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r ../wickra-synth-go-module/. .
          git add -A
          if git diff --cached --quiet; then
            echo "wickra-synth-go already up to date; tagging only"
          else
            git -c commit.gpgsign=false commit -q -m "Release v$version"
          fi
          git push origin HEAD:refs/heads/main
          git tag "v$version"
          git push origin "v$version"

  # --------------------------------------------------------------------------
  # GitHub Release: create a DRAFT, attach every built artefact, then publish-
  # release flips it to published (immutability-ready ordering).
  # --------------------------------------------------------------------------
  github-release:
    name: Attach assets to the draft GitHub Release
    timeout-minutes: 45
    # Every publisher, not a subset. A release that goes out while NuGet,
    # Maven or the Go mirror failed is a release whose page lists artefacts
    # that do not exist in half the ecosystems it claims.
    needs:
      [
        cargo-publish,
        python-publish,
        node-publish,
        wasm-publish,
        cli-binaries,
        c-abi-build,
        csharp-publish,
        java-publish,
        go-mirror,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve target tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          fi
          if [ -z "$tag" ]; then
            echo "::error::no v* tag found to attach assets to"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::attaching assets to release $tag"
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          set -e
          mkdir -p release-assets
          find artifacts -type f -name "*.whl" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.node" -exec cp {} release-assets/ \;
          find artifacts -type f -name "wickra-synth-*.tgz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.crate" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.cdx.json" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.nupkg" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.jar" -exec cp {} release-assets/ \;
          ls -lh release-assets/
          echo "asset-count=$(find release-assets -type f | wc -l)"
      - name: Create / update the draft GitHub Release with assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: wickra-synth ${{ steps.tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: true
          body: |
            wickra-synth ${{ github.ref_name }} — a deterministic synthetic market-microstructure generator: a JSON GenSpec (master seed, a sequence of trend / range / crash / vol regimes, an order-book and trade-flow microstructure model and an optional funding schedule) folds into a fixed stream of candles, book snapshots, trades and funding samples, replayable byte-for-byte from the seed alone. Native Rust, Python, Node.js, WASM plus a C ABI hub for C, C++, C#, Go, Java, R — every binding produces byte-identical output. Not a crypto-secure RNG; for testing, training and demos only.

            ### Install

            ```bash
            cargo install wickra-synth
            pip install wickra-synth
            npm install wickra-synth
            dotnet add package Wickra.Synth
            go get github.com/wickra-lib/wickra-synth/bindings/go
            ```

            Java (Maven Central):

            ```xml
            <dependency>
              <groupId>org.wickra</groupId>
              <artifactId>wickra-synth</artifactId>
              <version>${{ steps.tag.outputs.version }}</version>
            </dependency>
            ```

            R (r-universe):

            ```r
            install.packages("wickrasynth", repos = "https://wickra-lib.r-universe.dev")
            ```

            ### Attached assets

            Pre-built artefacts for every supported platform — the same files this
            workflow run published to crates.io, PyPI, and npm — plus standalone
            CLI binaries and the C ABI libraries. C# ships to NuGet, Java to Maven
            Central, Go via a `bindings/go` subdirectory tag, and R to r-universe
            via their own release jobs.

            ### Auto-generated changelog

            See below; GitHub computes it from the commits since the previous tag.

  # --------------------------------------------------------------------------
  # Build provenance attestations
  # --------------------------------------------------------------------------
  attestations:
    name: Attest build provenance
    timeout-minutes: 45
    needs:
      [
        cargo-publish,
        python-wheels,
        python-sdist,
        csharp-publish,
        java-publish,
        c-abi-build,
        cli-binaries,
        github-release,
      ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download crate files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-files
          path: artifacts/crates
      - name: Download wheels + sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: artifacts/python
          merge-multiple: true
      # Three artefact kinds were built, published and attested by nothing: the
      # NuGet package, the Maven jar and the C ABI tarballs every C-capable
      # language links against. The C ABI is the one that matters most -- it is
      # the binary six of the ten reaches load at run time.
      - name: Download the NuGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts/nuget
      - name: Download the Maven artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-artifacts
          path: artifacts/maven
      - name: Download the C ABI tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: artifacts/c-abi
          merge-multiple: true
      # The standalone executables. Neither reference repository ships a CLI, so
      # no inherited configuration covered these -- and they are the artefact a
      # user is most likely to download and run directly, which makes them the
      # ones least defensible to leave unattested.
      - name: Download the CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: artifacts/cli
          merge-multiple: true
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/crates/*.crate
            artifacts/python/*.whl
            artifacts/python/*.tar.gz
            artifacts/nuget/*.nupkg
            artifacts/maven/*.jar
            artifacts/c-abi/*.tar.gz
            artifacts/cli/*.tar.gz
      - name: Attach provenance bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot attach provenance."
            exit 1
          fi
          if [ -z "$BUNDLE" ] || [ ! -f "$BUNDLE" ]; then
            echo "::error::attestation bundle not found at '$BUNDLE'."
            exit 1
          fi
          dest="wickra-synth-${TAG}.provenance.intoto.jsonl"
          cp "$BUNDLE" "$dest"
          echo "Uploading $dest to release $TAG"
          gh release upload "$TAG" "$dest" --clobber --repo "${{ github.repository }}"

  # --------------------------------------------------------------------------
  # Publish the drafted release LAST (immutability-ready).
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish the GitHub Release
    timeout-minutes: 45
    needs: [github-release, attestations]
    if: always() && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Flip the draft release to published (latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot publish."
            exit 1
          fi
          echo "::notice::publishing release $TAG (draft -> published, latest)"
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
