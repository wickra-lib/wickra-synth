# CodeQL analysis configuration, referenced from .github/workflows/codeql.yml.
#
# Two files are excluded, and only two. `bindings/node/index.js` and
# `index.d.ts` are emitted by napi-rs -- both carry the generator's own
# "auto-generated by NAPI-RS" stamp on line one, and both are regenerated and
# drift-checked by CI, so a finding in either is a finding against napi-rs and
# not against anything anyone here can change. The JavaScript extractor would
# otherwise read 24 kB of loader glue that dispatches across six platform
# packages and reports the same shape once per branch.
#
# The rule for adding to this list: a path belongs here when a generator owns the
# file end to end and stamps it as such, never because a finding in it was
# inconvenient. Everything else in this repository is written by hand and stays
# in the analysis -- including the four places where a memory mistake is actually
# possible: `bindings/c/src/lib.rs` (the raw-pointer ABI), `bindings/go`
# (unsafe.Pointer through cgo), `bindings/r/src/wickra_synth.c` (C with an
# external-pointer finalizer) and `bindings/c/include/wickra_synth.hpp` (a
# hand-written RAII wrapper the C++ example compiles).
paths-ignore:
  - bindings/node/index.js
  - bindings/node/index.d.ts
