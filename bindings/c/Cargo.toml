[package]
name = "wickra-synth-c"
description = "C ABI (cdylib + staticlib) for wickra-synth — the hub every C-capable language (C, C++, C#, Go, Java, R) links against."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "wickra_synth"
# cdylib and staticlib are what the six C-capable languages link. rlib is here
# so the fuzz crate can link this one as a Rust dependency: this is the only
# `unsafe` in the workspace and the only place a memory fault can originate,
# SECURITY.md names its buffer protocol as in scope, and a surface that takes
# outside data owes a fuzz target. Neither of the other two crate types can be
# depended on from Rust, so without this the one thing worth fuzzing is the one
# thing that cannot be.
crate-type = ["cdylib", "staticlib", "rlib"]

# The C ABI inherently needs `unsafe` (raw pointers across the FFI boundary); the
# workspace forbids it everywhere else, so this crate re-allows it locally. The
# clippy set mirrors the workspace with the usual FFI-cast exemptions.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"

[dependencies]
# The core. The `validate` feature is deliberately off across the
# JSON-over-C-ABI boundary — the hub forwards, it does not second-guess.
wickra-synth-core = { workspace = true }
