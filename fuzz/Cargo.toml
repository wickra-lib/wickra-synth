[package]
name = "wickra-synth-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
# The core under test.
wickra-synth-core = { path = "../crates/synth-core", default-features = false }
# The C ABI hub, linked as an rlib so its buffer protocol -- the workspace's only
# unsafe code -- can actually be driven with arbitrary bytes.
wickra-synth-c = { path = "../bindings/c" }

# Detach from the parent workspace — cargo-fuzz builds this crate on its own with
# sanitizer flags on a nightly toolchain.
[workspace]

[[bin]]
name = "spec_toml"
path = "fuzz_targets/spec_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "c_abi_buffer"
path = "fuzz_targets/c_abi_buffer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spec_parse"
path = "fuzz_targets/spec_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "generate"
path = "fuzz_targets/generate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rng_stream"
path = "fuzz_targets/rng_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_json"
path = "fuzz_targets/command_json.rs"
test = false
doc = false
bench = false
