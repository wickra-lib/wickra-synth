# OSV-Scanner suppressions (VEX record). Consumed by OSV-Scanner and the
# OpenSSF Scorecard Vulnerabilities check. Each entry is an advisory assessed as
# not affecting wickra-synth; the Rust half mirrors the cargo-deny `ignore` list
# in deny.toml, and the entries below cover the ecosystems cargo-deny cannot see.
#
# Keep the Rust entries in lock-step with deny.toml's [advisories].ignore.
# deny.toml currently has none: no Rust advisory is outstanding.

[[IgnoredVulns]]
id = "GHSA-6w46-j5rx-g56g"
reason = """
pytest's tmpdir handling: on UNIX it uses the predictable /tmp/pytest-of-<user>
pattern, so another local user on the same machine can cause a denial of service
or, in the wrong permissions setup, escalate. Fixed in pytest 9.0.3.

Not reachable here, and the pin is deliberate rather than lazy. pytest appears
only in .github/requirements/ci-dev.txt, which is test tooling and ships in no
artefact: it is absent from every crate, wheel, npm package, nupkg, jar and R
tarball this repository publishes. It runs in exactly two places -- an ephemeral
single-tenant GitHub runner, where there is no second local user to be the
attacker, and a contributor's own machine, where that user already has their own
privileges.

The pin cannot simply move. pytest 9 requires Python 3.10, and the CI matrix
covers 3.9 because bindings/python builds an abi3-py39 wheel and 3.9 is the floor
the manifest declares. Taking pytest 9 would mean either dropping 3.9 from the
matrix while still shipping wheels for it -- testing less than we publish -- or
carrying two locks for one dependency. Revisit when the Python floor moves to
3.10; the lockfile is regenerated by scripts/update-lockfiles.sh, and this entry
goes with it.
"""
